name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      BLOOMBOARD_KEYSTORE_BASE64: ${{ secrets.BLOOMBOARD_KEYSTORE_BASE64 }}
      BLOOMBOARD_STORE_PASSWORD: ${{ secrets.BLOOMBOARD_STORE_PASSWORD }}
      BLOOMBOARD_KEY_ALIAS: ${{ secrets.BLOOMBOARD_KEY_ALIAS }}
      BLOOMBOARD_KEY_PASSWORD: ${{ secrets.BLOOMBOARD_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.3.13750724" "cmake;3.22.1"
      - name: Load signing secrets
        run: |
          missing=0
          for name in BLOOMBOARD_KEYSTORE_BASE64 BLOOMBOARD_STORE_PASSWORD BLOOMBOARD_KEY_ALIAS BLOOMBOARD_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub secret $name is not set"
              missing=1
            fi
          done
          test "$missing" -eq 0
          printf '%s' "$BLOOMBOARD_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bloomboard.jks"
          test -s "$RUNNER_TEMP/bloomboard.jks"
          echo "BLOOMBOARD_KEYSTORE=$RUNNER_TEMP/bloomboard.jks" >> "$GITHUB_ENV"
          echo "BLOOMBOARD_REQUIRE_SIGNING=true" >> "$GITHUB_ENV"
      - name: Build release APKs
        run: ./gradlew assembleRelease test --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p dist
          find app/build/outputs/apk/release -name '*.apk' -exec cp {} dist/ \;
          cd dist
          sha256sum *.apk > SHA256SUMS
          printf '%s\n' \
            'armeabi-v7a' \
            'arm64-v8a' \
            'x86' \
            'x86_64' \
            'universal (all of the above)' > ARCHITECTURES.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS
            dist/ARCHITECTURES.txt
          body: |
            Android APKs for every CPU architecture, plus a universal APK.

            - `universal` installs on armeabi-v7a, arm64-v8a, x86 and x86_64
            - otherwise pick the APK that matches the phone or emulator

            The interface is Kotlin. A tiny native marker exists only so each split APK is tied to one CPU.
          generate_release_notes: true
